<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1f5">
  <meta name="description" content="เกมเล็ก ๆ สำหรับขอโทษและง้อคนพิเศษ">
  <title>ขอโทษนะครับพี่ 🥺</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--bg:#fff1f5;--card:#fff;--ink:#5b2a40;--muted:#9a6a7e;--pink:#ff6b9d;--pink2:#ffb3cd;--soft:#ffe1ec;font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a1621;--card:#3b2030;--ink:#ffe6ef;--muted:#d9a3ba;--pink:#ff7fa8;--pink2:#8f3b5c;--soft:#4a2638}}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#2a1621;--card:#3b2030;--ink:#ffe6ef;--muted:#d9a3ba;--pink:#ff7fa8;--pink2:#8f3b5c;--soft:#4a2638}
    *{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;justify-content:center;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:inherit;line-height:1.7}main{width:100%;max-width:480px;margin:auto;padding:24px 20px 48px;text-align:center}#meter{display:none;margin-bottom:22px;text-align:left}#meter.on{display:block}#mlabel{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:14px;font-weight:600}.track{height:14px;overflow:hidden;border-radius:99px;background:var(--soft)}#fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),#ff8dae);transition:width .5s ease}.face{display:inline-block;font-size:80px;line-height:1;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}h1{font-size:24px;line-height:1.45;margin:14px 0 8px}.sub{color:var(--muted);margin:0 0 22px;font-size:15px}.step{margin:10px 0 0;color:var(--muted);font-size:14px;font-weight:600}#stage.in{animation:appear .32s ease-out}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.opts{display:grid;gap:12px;margin-top:20px}button{font:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}button:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.opt{padding:14px 16px;border:2px solid var(--pink2);border-radius:20px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;box-shadow:0 5px 0 var(--soft);transition:transform .15s,border-color .15s}.opt:hover{border-color:var(--pink);transform:translateY(-2px)}.main{padding:14px 30px;border-radius:999px;background:var(--pink);color:#fff;font-size:18px;font-weight:700;box-shadow:0 5px 0 var(--pink2);transition:transform .15s}.main:hover{transform:scale(1.03)}.main:active,.opt:active{transform:translateY(2px)}.btns{position:relative;height:180px;margin-top:24px}#yes{position:absolute;top:6px;left:50%;z-index:2;white-space:nowrap;transform:translateX(-50%)}#no{position:absolute;top:96px;left:50%;width:150px;margin-left:-75px;padding:10px 14px;border:2px solid var(--pink2);border-radius:999px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .22s} .big{display:inline-block;font-size:90px;line-height:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}.gap{height:18px}.card{margin:20px 0;padding:20px;border:2px solid var(--pink2);border-radius:24px;background:var(--card);text-align:left;box-shadow:0 6px 0 var(--soft)}.card h2{margin:0 0 14px;color:var(--pink);font-size:18px}.qa{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--pink2)}.qa:last-child{margin:0;padding:0;border:0}.qa small{display:block;color:var(--muted);font-size:13px}.qa-val{font-size:15px;font-weight:600;overflow-wrap:anywhere}textarea{width:100%;padding:12px 14px;border:2px solid var(--pink2);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;resize:vertical}#send-status{min-height:1.7em}.heart{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.heart{display:none}}
  </style>
</head>
<body>
<main>
  <div id="meter" aria-live="polite"><div id="mlabel"><span>ความงอล/นอยของพี่</span><span id="mpct">100%</span></div><div class="track"><div id="fill"></div></div></div>
  <div id="stage" aria-live="polite"></div>
</main>
<script>
(function(){
  // ใส่อีเมลผู้รับเพื่อเปิดการส่งคำตอบอัตโนมัติผ่าน FormSubmit
  // ตัวอย่าง: const OWNER_EMAIL = 'you@example.com';
  // อีเมลนี้จะแสดงใน source code ของเว็บไซต์สาธารณะ
  const OWNER_EMAIL = 'nantatsitfame@gmail.com';
  const stage=document.getElementById('stage'),meter=document.getElementById('meter'),fill=document.getElementById('fill'),mpct=document.getElementById('mpct');
  let mood=100,answers=[],answersSent=false;
  const Q=[
    {e:'🤔',q:'ข้อแรก! ตอนนี้พี่เป็นแบบไหนเอ่ย?',o:[['งอลเฉยๆ','😤','งอลเหรอครับ ขอโทษนะ ผมรู้ตัวแล้วว่าผิดจริงๆ'],['นอย','🥺','นอยเหรอครับ... ขอโทษที่ทำให้พี่นอยนะ ผมใจหายเลย'],['งอลด้วย นอยด้วย','😭','โอ๊ย ผมผิดสองเด้งเลย ขอโทษๆ ครับ'],['ไม่งอล ไม่นอย','🥹','จริงเหรอครับ!! ดีใจจัง แต่ผมขอโทษไว้ก่อนนะ เผื่อพี่แอบนอย']]},
    {e:'🧋',q:'ถ้าผมจะง้อ พี่อยากให้ผมทำอะไรบ้างครับ? พิมพ์บอกผมได้เลย',t:1,ph:'พิมพ์บอกผมตรงนี้เลยครับ เช่น อยากให้เลี้ยงอะไร พาไปไหน...',r:['📝','ผมจดไว้แล้วครับ จะทำให้ครบเลย!']},
    {e:'💭',q:'พี่งอลผมด้วยเรื่องอะไรบ้างค้าบ จะได้ไม่ให้มีอีก อยากรู้เรื่องของพี่มากกว่านี้ด้วยน้ะะ',t:1,ph:'เล่าให้ผมฟังได้เลยครับ เรื่องไหนที่พี่ไม่ชอบ...',r:['🥹','ขอบคุณที่บอกนะครับ ผมจะจำไว้ ไม่ทำอีกแน่นอน']},
    {e:'👑',q:'คำถามสุดท้าย! ใครน่ารักที่สุดในโลก?',o:[['พี่','🥰','ตอบถูกครับ!'],['พี่นั่นแหละ','😘','ถูกอีกแล้ว เก่งมาก!'],['ก็พี่ไง','💞','ไม่มีผิดเลยสักข้อ']]}
  ];
  function render(html){stage.innerHTML=html;stage.classList.remove('in');void stage.offsetWidth;stage.classList.add('in');window.scrollTo(0,0)}
  function setMood(v){mood=Math.max(0,v);fill.style.width=mood+'%';mpct.textContent=mood+'%'}
  function intro(){meter.classList.remove('on');setMood(100);answers=[];answersSent=false;render('<div class="face">🥺</div><h1>พี่ครับ... อย่างอลผมเลยน้า</h1><p class="sub">ผมรู้ตัวแล้วว่าผิด ขอโทษจริงๆ นะครับ<br>เลยทำเกมเล็กๆ มาง้อพี่ ตอบคำถามไม่กี่ข้อก็จบแล้ว</p><button class="main" id="go">เริ่มเลย 💖</button>');document.getElementById('go').onclick=()=>{meter.classList.add('on');question(0)}}
  function question(i){const d=Q[i];let h='<div class="face">'+d.e+'</div><p class="step">ข้อ '+(i+1)+' จาก '+Q.length+'</p><h1>'+d.q+'</h1><p class="sub" style="margin:0">ตอบตามจริงน้าา 🥺</p><div class="opts">';if(d.t){render(h+'<textarea id="ans" rows="4" maxlength="400" placeholder="'+d.ph+'" aria-label="คำตอบของพี่"></textarea></div><div class="gap"></div><button class="main" id="send">ตอบเลย</button>');document.getElementById('send').onclick=()=>{const v=document.getElementById('ans').value.trim();if(!v){document.getElementById('ans').focus();return}answers.push([d.q,v]);reactText(i)};return}d.o.forEach((o,j)=>h+='<button class="opt" data-j="'+j+'">'+o[0]+'</button>');render(h+'</div>');stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>react(i,Number(b.dataset.j)))}
  function nextButton(i){document.getElementById('next').onclick=()=>i<Q.length-1?question(i+1):finalAsk()}
  function react(i,j){const o=Q[i].o[j];answers.push([Q[i].q,o[0]]);setMood(mood-22);render('<div class="big">'+o[1]+'</div><h1>'+o[2]+'</h1><div class="gap"></div><button class="main" id="next">'+(i<Q.length-1?'ข้อต่อไป':'ไปต่อ')+'</button>');nextButton(i)}
  function reactText(i){const r=Q[i].r;setMood(mood-22);render('<div class="big">'+r[0]+'</div><h1>'+r[1]+'</h1><div class="gap"></div><button class="main" id="next">ข้อต่อไป</button>');nextButton(i)}
  function finalAsk(){render('<div class="face" id="ff">🥹</div><h1>ตกลงพี่ยกโทษให้ผมได้มั้ยครับ?</h1><p class="sub" id="cap">ผมตอบครบทุกข้อแล้วนะ</p><div class="btns"><button id="yes" class="main">ยกโทษให้ผมนะ 💖</button><button id="no" class="opt">ยังงอลอยู่ 😤</button></div>');const no=document.getElementById('no'),yes=document.getElementById('yes'),ff=document.getElementById('ff'),cap=document.getElementById('cap'),wrap=no.parentNode;let tries=0;const faces=['🥹','🥺','😢','😭','😭'],caps=['ผมตอบครบทุกข้อแล้วนะ','ผมเริ่มใจเสียแล้วนะ...','น้ำตาจะไหลแล้วน้าา','ฮือออ พี่ใจร้ายยย','พี่ยอมแล้วใช่มั้ยยย 🥹'],txt=['ยังงอลอยู่ 😤','จับให้ได้สิ 😝','อ้าว หนีทัน 🏃','ผมตามไม่ทันแล้ว 🥲','ก็ได้ๆ หายงอลก็ได้ 🙈'];function dodge(e){if(tries>=4)return;if(e)e.preventDefault();tries++;no.textContent=txt[tries];ff.textContent=faces[tries];cap.textContent=caps[tries];const dx=(Math.random()-.5)*Math.max(0,wrap.clientWidth-160),dy=(Math.random()-.5)*80-10;no.style.transform='translate('+dx+'px,'+dy+'px) scale('+(1-tries*.08)+')';yes.style.transform='translateX(-50%) scale('+(1+tries*.15)+')'}no.addEventListener('pointerenter',dodge);no.addEventListener('pointerdown',dodge);no.addEventListener('click',()=>{if(tries>=4)win()});yes.onclick=win}
  function summary(){if(!answers.length)return '';let h='<div class="card"><h2>สรุปคำตอบของพี่ 📝</h2>';answers.forEach(a=>{h+='<div class="qa"><small></small><div class="qa-val"></div></div>';const box=document.createElement('div');box.innerHTML=h;const qa=box.lastElementChild;qa.querySelector('small').textContent=a[0];qa.querySelector('.qa-val').textContent=a[1];h=box.innerHTML});return h+'</div>'}
  async function sendAnswers(){const status=document.getElementById('send-status'),retry=document.getElementById('retry-send');if(answersSent)return;if(!OWNER_EMAIL){status.textContent='ยังไม่ได้ตั้งค่าอีเมลรับคำตอบ คำตอบแสดงอยู่ด้านบนและยังไม่ถูกส่ง';return}answersSent=true;status.textContent='กำลังส่งคำตอบให้... 💌';retry.hidden=true;try{const response=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(OWNER_EMAIL),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'คำตอบจากเกมง้อ 💖',answers:answers.map(a=>a[0]+'\nคำตอบ: '+a[1]).join('\n\n')})});const result=await response.json();if(!response.ok||!(result.success===true||result.success==='true'))throw new Error('ส่งไม่สำเร็จ');status.textContent='ส่งคำตอบให้แล้ว 💌'}catch(e){answersSent=false;status.textContent='ส่งไม่สำเร็จ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง';retry.hidden=false}}
  function hearts(){const set=['💖','💗','💕','🌸','✨','🧋','🥰'];for(let i=0;i<24;i++)setTimeout(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const h=document.createElement('span');h.className='heart';h.textContent=set[Math.floor(Math.random()*set.length)];h.style.left=Math.random()*100+'vw';h.style.fontSize=18+Math.random()*24+'px';h.style.animationDuration=2.5+Math.random()*2.5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),5500)},i*80)}
  function win(){setMood(0);render('<div class="big">🥰</div><h1>เย้! พี่หายงอลแล้ว</h1><p class="sub">ขอบคุณที่ใจดีกับผมนะครับ<br>ต่อไปผมจะระวังให้มากกว่านี้ แล้วเดี๋ยวไปเลี้ยงชานมนะ 🧋</p>'+summary()+'<p class="sub" id="send-status" role="status" aria-live="polite">กำลังเตรียมส่งคำตอบ... 💌</p><button class="opt" id="retry-send" style="width:100%;margin-bottom:12px" hidden>ลองส่งอีกครั้ง</button><button class="opt" id="again" style="width:100%">เล่นอีกรอบ 🔄</button>');hearts();document.getElementById('again').onclick=intro;document.getElementById('retry-send').onclick=sendAnswers;sendAnswers()}
  intro();
})();
</script>
</body>
</html>
